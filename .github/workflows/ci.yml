name: CI

# Runs on every push and pull request: lint, test, and prove the images still
# build. Nothing is published from here — see release.yml for that.

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (errors)
        # Syntax errors and undefined names fail the build; style does not.
        run: flake8 src app tests --count --select=E9,F63,F7,F82,F821 --show-source --statistics

      - name: Lint (style, advisory)
        run: flake8 src app tests --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - name: Tests
        run: pytest tests/ -q

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [api, streamlit, drift, airflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false
          tags: rakuten-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
