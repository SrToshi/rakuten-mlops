name: Release

# Only master. Same gates as CI, then the images are published to Docker Hub.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN      (an access token, not the account password)

on:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (errors)
        run: flake8 src app tests --count --select=E9,F63,F7,F82,F821 --show-source --statistics

      - name: Tests
        run: pytest tests/ -q

  publish:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Skipped rather than failed on a fork or before the secrets are set.
    if: github.repository_owner != '' && vars.PUBLISH_IMAGES == 'true'
    strategy:
      matrix:
        service: [api, streamlit, drift, airflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rakuten-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rakuten-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
